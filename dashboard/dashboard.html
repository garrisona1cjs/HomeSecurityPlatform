<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>LayerSeven Security Platform</title>



<script src="https://unpkg.com/globe.gl"></script>

<style>

body{
  margin:0;
  background:black;
  overflow:hidden;
  font-family:Arial;
}

/* ======================================================
SOC PANEL
====================================================== */

#socPanel{

position:absolute;
top:20px;
left:20px;

width:220px;

background:rgba(0,0,0,0.7);
border:1px solid #00ffff;

padding:14px;

color:#00ffff;
font-size:14px;

backdrop-filter:blur(6px);

}

.panelTitle{

font-weight:bold;
margin-top:10px;
margin-bottom:6px;

color:#ffffff;

}

.metric{

display:flex;
justify-content:space-between;
margin-bottom:4px;

}

#countryList{

margin-top:8px;
font-size:13px;

}

#globeViz{
  width:100vw;
  height:100vh;
}

</style>

</head>

<body>

<div id="globeViz"></div>

<!-- ======================================================
SOC INTELLIGENCE PANEL
====================================================== -->

<div id="socPanel">

<div class="panelTitle">SOC LIVE TELEMETRY</div>

<div class="metric">
<span>CRITICAL</span>
<span id="criticalCount">0</span>
</div>

<div class="metric">
<span>HIGH</span>
<span id="highCount">0</span>
</div>

<div class="metric">
<span>MEDIUM</span>
<span id="mediumCount">0</span>
</div>

<div class="panelTitle">TOP ATTACK COUNTRIES</div>

<div id="countryList"></div>

</div>

<script>

// ======================================================
// SOC LOCATION
// ======================================================

const SOC_LAT = 41.5868
const SOC_LON = -93.6250


// ======================================================
// DATA STORES
// ======================================================

let arcs = []
let rings = []
let points = []

// heatmap attack density
let heatmap = []

// animated network packets
let packets = []

// global shockwaves
let shockwaves = []

// security satellites
let satellites = []

// ======================================================
// 3D VISUAL OBJECTS
// ======================================================

let attackCones = []
let shieldMeshes = []

// ======================================================
// ADVANCED SYSTEMS
// ======================================================

let storms = []
let satelliteBeams = []

// ======================================================
// SOC STATISTICS
// ======================================================

let severityStats = {

CRITICAL:0,
HIGH:0,
MEDIUM:0

}

let countryStats = {}

let alertQueue = []

// SOC visual safety limits
const MAX_ARCS = 500
const MAX_RINGS = 400
const MAX_POINTS = 200

const MAX_QUEUE = 2000
let EVENT_DROP_COUNT = 0


// ======================================================
// CREATE GLOBE
// ======================================================

const globe = Globe()(document.getElementById("globeViz"))


// ======================================================
// DELAYED THREE ACCESS (FIXES INITIALIZATION ISSUE)
// ======================================================

let THREE = null

setTimeout(() => {
    THREE = globe.scene().children[0]?.__proto__?.constructor
    console.log("THREE loaded:", THREE)
}, 500)


// ======================================================
// CONFIGURE GLOBE
// ======================================================

globe
.globeImageUrl("//unpkg.com/three-globe/example/img/earth-night.jpg")
.backgroundColor("black")

.arcsData(arcs)
.arcColor("color")
.arcAltitude(0.25)
.arcStroke(0.8)
.arcDashLength(0.4)
.arcDashGap(4)
.arcDashAnimateTime(1200)

.ringsData(rings.concat(shockwaves))
.ringMaxRadius("maxR")
.ringPropagationSpeed(2)
.ringColor(d => d.color || "#ff0033")

.pointsData(points.concat(packets).concat(satellites))
.pointAltitude(0)
.pointRadius("size")
.pointColor("color")






// ======================================================
// HEATMAP LAYER
// ======================================================

.heatmapsData([heatmap])
.heatmapBandwidth(2.5)
.heatmapColorSaturation(0.9)













// ======================================================
// ATTACK BEAM
// ======================================================

function createAttackBeam(lat,lng,severity,classifiedColor){

const color = classifiedColor ||
(
severity === "CRITICAL" ? "#ff0033" :
severity === "HIGH" ? "#ff5500" :
severity === "MEDIUM" ? "#ffaa00" :
"#00ffff"
)

arcs.push({

startLat:lat,
startLng:lng,

endLat:SOC_LAT,
endLng:SOC_LON,

color:[color,color]

})

// keep arc list bounded
if(arcs.length > MAX_ARCS){
arcs.shift()
}

globe.arcsData(arcs)

}

// ======================================================
// REVERSE ATTACK TRACE
// ======================================================

function createReverseTrace(lat,lng){

arcs.push({

startLat:SOC_LAT,
startLng:SOC_LON,

endLat:lat,
endLng:lng,

color:["#00ffff","#00ffff"]

})

if(arcs.length > MAX_ARCS){
arcs.shift()
}

globe.arcsData(arcs)

}

// ======================================================
// 3D ATTACK CONE (STABLE VERSION)
// ======================================================

function createAttackCone(lat, lng, severity){

    // prevent crash if THREE not ready yet
    if (!THREE) return

    const scene = globe.scene()

    // geometry
    const geometry = new THREE.ConeGeometry(0.5, 5, 16)

    // color by severity
    const color =
        severity === "CRITICAL" ? 0xff0033 :
        severity === "HIGH" ? 0xff5500 :
        severity === "MEDIUM" ? 0xffaa00 :
        0x00ffff

    // material
    const material = new THREE.MeshBasicMaterial({
        color: color,
        transparent: true,
        opacity: 0.6
    })

    // mesh
    const cone = new THREE.Mesh(geometry, material)

    // position on globe
    const pos = globe.getCoords(lat, lng, 0.01)
    cone.position.set(pos.x, pos.y, pos.z)

    // aim toward SOC
    const target = globe.getCoords(SOC_LAT, SOC_LON, 0.01)
    cone.lookAt(target)

    // add to scene
    scene.add(cone)

    // track for cleanup
    attackCones.push({
        mesh: cone,
        created: Date.now()
    })
}

// ======================================================
// CYBER STORM ENGINE
// ======================================================

function createStorm(lat,lng){

// find nearby storm
let storm = storms.find(s =>
Math.abs(s.lat - lat) < 5 &&
Math.abs(s.lng - lng) < 5
)

if(!storm){

storm = {
lat:lat,
lng:lng,
points:[],
rotation:0
}

storms.push(storm)

}

// add point to storm
storm.points.push({
angle:Math.random()*Math.PI*2,
radius:0.5 + Math.random()
})

}

// animate storms
function animateStorms(){

const scene = globe.scene()

storms.forEach(storm => {

storm.rotation += 0.05

storm.points.forEach(p => {

p.angle += 0.05

const x = storm.lat + Math.cos(p.angle) * p.radius
const y = storm.lng + Math.sin(p.angle) * p.radius

// reuse packet visual
points.push({
lat:x,
lng:y,
size:0.3,
color:"#ff0033"
})

})

})

// limit points
if(points.length > MAX_POINTS){
points.splice(0, points.length - MAX_POINTS)
}

globe.pointsData(points.concat(packets).concat(satellites) || [])

}

setInterval(animateStorms,80)

// ======================================================
// CONE CLEANUP ENGINE
// ======================================================

function animateCones(){

const now = Date.now()

for(let i=attackCones.length-1;i>=0;i--){

let c = attackCones[i]

let age = now - c.created

c.mesh.material.opacity = Math.max(0,0.6 - age/3000)

if(age > 3000){
globe.scene().remove(c.mesh)
attackCones.splice(i,1)
}

}

}

setInterval(animateCones,60)

// ======================================================
// PACKET STREAM GENERATOR
// ======================================================

function createPacketStream(lat,lng){

const count = 6

for(let i=0;i<count;i++){

packets.push({

startLat:lat,
startLng:lng,

lat:lat,
lng:lng,

progress:0,

size:0.35,
color:"#00ffff"

})

}

}

// ======================================================
// PACKET ANIMATION ENGINE
// ======================================================

function animatePackets(){

for(let i=packets.length-1;i>=0;i--){

let p = packets[i]

p.progress += 0.02

p.lat = p.startLat + (SOC_LAT - p.startLat) * p.progress
p.lng = p.startLng + (SOC_LON - p.startLng) * p.progress

if(p.progress >= 1){
packets.splice(i,1)
}

}

// update render layer
globe.pointsData(points.concat(packets).concat(satellites) || [])

}

setInterval(animatePackets,50)

// ======================================================
// FOCUS CAMERA ON ATTACK
// ======================================================

function focusAttack(lat,lng){

globe.pointOfView({

lat:lat,
lng:lng,
altitude:1.5

},800)

}

// ======================================================
// GLOBAL ATTACK SHOCKWAVE
// ======================================================

function createShockwave(lat,lng){

shockwaves.push({

lat:lat,
lng:lng,
maxR:30,
color:"#ff0033"

})

if(shockwaves.length > 50){
shockwaves.shift()
}

globe.ringsData(rings.concat(shockwaves))

}

// ======================================================
// SOC DEFENSE SHIELD (STABLE VERSION)
// ======================================================

function createShieldPulse(){

    // prevent crash if THREE not ready yet
    if (!THREE) return

    const scene = globe.scene()

    const geometry = new THREE.SphereGeometry(1.2, 32, 32)

    const material = new THREE.MeshBasicMaterial({
        color: 0x00ffff,
        transparent: true,
        opacity: 0.4,
        wireframe: true
    })

    const sphere = new THREE.Mesh(geometry, material)

    // position at SOC
    const pos = globe.getCoords(SOC_LAT, SOC_LON, 0.01)
    sphere.position.set(pos.x, pos.y, pos.z)

    scene.add(sphere)

    shieldMeshes.push({
        mesh: sphere,
        scale: 1
    })
}

// ======================================================
// SHIELD ANIMATION
// ======================================================

function animateShield(){

for(let i=shieldMeshes.length-1;i>=0;i--){

let s = shieldMeshes[i]

s.scale += 0.05

s.mesh.scale.set(s.scale,s.scale,s.scale)

s.mesh.material.opacity -= 0.01

if(s.mesh.material.opacity <= 0){
globe.scene().remove(s.mesh)
shieldMeshes.splice(i,1)
}

}

}

setInterval(animateShield,50)

// ======================================================
// SATELLITE NETWORK
// ======================================================

function initSatellites(){

for(let i=0;i<12;i++){

satellites.push({

lat:(Math.random()*180)-90,
lng:(Math.random()*360)-180,
size:0.6,
color:"#00ffff",
altitude:0.25

})

}

globe.pointsData(points.concat(packets).concat(satellites) || [])

}

initSatellites()

// ======================================================
// SATELLITE ORBIT ENGINE
// ======================================================

function animateSatellites(){

satellites.forEach(s => {

s.lng += 0.15

if(s.lng > 180){
s.lng = -180
}

})

globe.pointsData(points.concat(packets).concat(satellites) || [])

}

setInterval(animateSatellites,60)

// ======================================================
// SATELLITE TRACKING BEAMS
// ======================================================

function createSatelliteBeam(lat,lng){

satellites.forEach(s => {

arcs.push({

startLat:s.lat,
startLng:s.lng,

endLat:lat,
endLng:lng,

color:["#00ffff","#00ffff"]

})

})

// limit arcs
if(arcs.length > MAX_ARCS){
arcs.splice(0, arcs.length - MAX_ARCS)
}

globe.arcsData(arcs)

}

// ======================================================
// SWARM BURST
// ======================================================

function createSwarmBurst(lat,lng){

for(let i=0;i<5;i++){

setTimeout(()=>{

rings.push({

lat:lat,
lng:lng,
maxR:6+Math.random()*4

})

// keep ring list bounded
if(rings.length > MAX_RINGS){
rings.shift()
}

globe.ringsData(rings.concat(shockwaves))

},i*120)

}

}


// ======================================================
// THREAT FLASH
// ======================================================

function createThreatFlash(lat,lng){

points.push({

lat:lat,
lng:lng,
size:1.5,
color:"#ff0033"

})

// keep list bounded
if(points.length > MAX_POINTS){
points.shift()
}

globe.pointsData(points.concat(packets).concat(satellites) || [])

setTimeout(()=>{

points.shift()
globe.pointsData(points.concat(packets).concat(satellites) || [])

},800)

}

// ======================================================
// AI THREAT CLASSIFIER
// ======================================================

function classifyThreat(alert){

if(!alert.technique) return null

const t = alert.technique.toLowerCase()

if(t.includes("scan")) return "#00ffff"
if(t.includes("exploit")) return "#ff5500"
if(t.includes("beacon")) return "#aa00ff"

return null

}

// ======================================================
// HEATMAP UPDATE
// ======================================================

function addHeat(lat,lng){

heatmap.push({
lat:lat,
lng:lng,
weight:1
})

// limit heatmap growth
if(heatmap.length > 1500){
heatmap.shift()
}

globe.heatmapsData([heatmap])

}


// ======================================================
// PROCESS ALERT
// ======================================================

function processAlert(alert){

const lat=parseFloat(alert.latitude)
const lng=parseFloat(alert.longitude)

if(!lat || !lng) return

// visualization
const classifiedColor = classifyThreat(alert)

createAttackBeam(lat,lng,alert.severity, classifiedColor)
createReverseTrace(lat,lng)
createSwarmBurst(lat,lng)
createThreatFlash(lat,lng)
addHeat(lat,lng)
focusAttack(lat,lng)
createPacketStream(lat,lng)
createStorm(lat,lng)
createSatelliteBeam(lat,lng)

// 3D cones for serious attacks
if(alert.severity === "HIGH" || alert.severity === "CRITICAL"){
createAttackCone(lat,lng,alert.severity)
}

// SOC defense shield reacts to all attacks
createShieldPulse()

// critical shockwave
if(alert.severity === "CRITICAL"){
createShockwave(lat,lng)
}

// track severity

if(alert.severity && severityStats[alert.severity] !== undefined){

severityStats[alert.severity]++


}

// track country

if(alert.country_code){

countryStats[alert.country_code] =

(countryStats[alert.country_code] || 0) + 1

}

updateSOCPanel()

}

// ======================================================
// UPDATE SOC PANEL
// ======================================================

function updateSOCPanel(){

document.getElementById("criticalCount").innerText = severityStats.CRITICAL
document.getElementById("highCount").innerText = severityStats.HIGH
document.getElementById("mediumCount").innerText = severityStats.MEDIUM

const list = Object.entries(countryStats)

.sort((a,b)=>b[1]-a[1])

.slice(0,5)

let html=""

list.forEach(([country,count])=>{

html += `<div>${country} : ${count}</div>`

})

document.getElementById("countryList").innerHTML = html

}


// ======================================================
// QUEUE PROCESSOR
// ======================================================

function processQueue(){

if(alertQueue.length===0) return

const alert=alertQueue.shift()

processAlert(alert)

}

setInterval(processQueue,120)


// ======================================================
// WEBSOCKET STREAM
// ======================================================

const protocol=location.protocol==="https:"?"wss":"ws"

const ws=new WebSocket(`${protocol}://${location.host}/ws`)

ws.onmessage=e=>{

try{

const msg=JSON.parse(e.data)

if(msg.type==="batch" && Array.isArray(msg.events)){

msg.events.forEach(alert=>{

if(alertQueue.length>MAX_QUEUE){
EVENT_DROP_COUNT++
}else{
alertQueue.push(alert)
}

})

}else{

if(msg.latitude && msg.longitude){

if(alertQueue.length>MAX_QUEUE){
EVENT_DROP_COUNT++
}else{
alertQueue.push(msg)
}

}

}

}catch(err){

console.error("WebSocket error",err)

}

}


// ======================================================
// LOAD DATABASE ALERTS
// ======================================================

async function load(){

const data=await fetch("/alerts").then(r=>r.json())

if(!Array.isArray(data)){
console.warn("Alerts response not array",data)
return
}

data.forEach(alert=>{

processAlert(alert)

})

}


// ======================================================
// INITIAL LOAD
// ======================================================

load()

// ======================================================
// GLOBE ROTATION
// ======================================================

let rotationSpeed = 0.02

function rotateGlobe(){

const controls = globe.controls()

if(!controls) return

controls.autoRotate = true
controls.autoRotateSpeed = rotationSpeed

}

rotateGlobe()


// ======================================================
// WEBGL CONTEXT RECOVERY
// ======================================================

window.addEventListener("webglcontextlost",function(e){

console.warn("WebGL context lost - reloading dashboard")

e.preventDefault()

setTimeout(()=>{

location.reload()

},2000)

},false)

</script>

</body>
</html>
