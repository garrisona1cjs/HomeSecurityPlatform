<script>




// ======================================================
// SUPPRESS NON-CRITICAL THREE / WEBGL WARNINGS
// ======================================================

const originalWarn = console.warn
const originalError = console.error

function shouldSuppress(msg){
    return (
        msg.includes("THREE.Clock") ||
        msg.includes("Binding size") ||
        msg.includes("BindGroup") ||
        msg.includes("CommandBuffer") ||
        msg.includes("computeGroup") ||
        msg.includes("WebGPU")
    )
}

// suppress warnings
console.warn = function(...args){
    const msg = args.join(" ")
    if (shouldSuppress(msg)) return
    originalWarn.apply(console, args)
}

// suppress errors
console.error = function(...args){
    const msg = args.join(" ")
    if (shouldSuppress(msg)) return
    originalError.apply(console, args)
}



// ======================================================
// SOC LOCATION
// ======================================================

const SOC_LAT = 41.5868
const SOC_LON = -93.6250


// ======================================================
// DATA STORES
// ======================================================

let arcs = []
let rings = []
let points = []



// heatmap attack density
let heatmap = []

// animated network packets
let packets = []

// global shockwaves
let shockwaves = []

// security satellites
let satellites = []

let incidents = []


// ======================================================
// ADVANCED SYSTEMS
// ======================================================

let storms = []
let satelliteBeams = []

// ======================================================
// SOC STATISTICS
// ======================================================

let severityStats = {

CRITICAL:0,
HIGH:0,
MEDIUM:0

}

let countryStats = {}

let alertQueue = []


// ======================================================
// SOC ALERT QUEUE (UI TRACKING)
// ======================================================

let alertUIQueue = []

// ======================================================
// FILTER STATE
// ======================================================

let activeSeverities = {
    CRITICAL: true,
    HIGH: true,
    MEDIUM: true
}

let activeCountryFilter = ""
let activeTechniqueFilter = ""

// ======================================================
// REPLAY SYSTEM
// ======================================================

let replayEvents = []
let replayIndex = 0
let isReplaying = false
let replaySpeed = 300

let isScrubbing = false   // ✅ ADD THIS LINE RIGHT HERE
let isLiveMode = true   // ✅ NEW

// SOC visual safety limits
const MAX_ARCS = 500
const MAX_RINGS = 400
const MAX_POINTS = 200

const MAX_QUEUE = 2000
let EVENT_DROP_COUNT = 0


// ======================================================
// CREATE GLOBE
// ======================================================

const globe = Globe()(document.getElementById("globeViz"))





// ======================================================
// CONFIGURE GLOBE
// ======================================================

globe
.globeImageUrl("//unpkg.com/three-globe/example/img/earth-night.jpg")
.backgroundColor("black")

.arcsData(arcs)
.arcColor("color")
.arcAltitude(0.25)
.arcStroke(0.8)
.onArcClick(d => {

    if(isScrubbing) return

    openAttackPanel(d)

})
.arcDashLength(0.4)
.arcDashGap(4)
.arcDashAnimateTime(1200)

.ringsData(rings.concat(shockwaves))
.ringMaxRadius("maxR")
.ringPropagationSpeed(2)
.ringColor(d => d.color || "#ff0033")

.pointsData(points.concat(packets).concat(satellites).concat(incidents))
.pointAltitude(0)
.pointRadius("size")
.pointColor("color")






// ======================================================
// HEATMAP LAYER
// ======================================================

.heatmapsData([heatmap])
.heatmapBandwidth(2.5)
.heatmapColorSaturation(0.9)













// ======================================================
// ATTACK BEAM
// ======================================================

function createAttackBeam(lat, lng, severity, classifiedColor, alert){

let color = "#00ffff"

if(alert.riskScore >= 80) color = "#ff0033"
else if(alert.riskScore >= 50) color = "#ff5500"
else if(alert.riskScore >= 25) color = "#ffaa00"
else color = "#00ffff"

// allow classifier override
if(classifiedColor){
    color = classifiedColor
}

arcs.push({

    startLat:lat,
    startLng:lng,

    endLat:SOC_LAT,
    endLng:SOC_LON,

    color:[color,color],

    // ✅ REAL DATA FROM BACKEND
    severity: alert.severity,
    technique: alert.technique,
    country: alert.country_code || "Unknown",
    timestamp: alert.timestamp || Date.now()

})

// limit arcs
if(arcs.length > MAX_ARCS){
    arcs.shift()
}

if(arcs.length > 0){
    globe.arcsData(arcs)
}

}

// ======================================================
// REVERSE ATTACK TRACE
// ======================================================

function createReverseTrace(lat,lng){

arcs.push({

startLat:SOC_LAT,
startLng:SOC_LON,

endLat:lat,
endLng:lng,

color:["#00ffff","#00ffff"]

})

if(arcs.length > MAX_ARCS){
arcs.shift()
}

if(arcs.length > 0){
    globe.arcsData(arcs)
}

}

// ======================================================
// VOLUMETRIC ATTACK (STABLE - NO THREE)
// ======================================================

function createAttackVolume(lat, lng, severity){

    const color =
        severity === "CRITICAL" ? "#ff0033" :
        severity === "HIGH" ? "#ff5500" :
        severity === "MEDIUM" ? "#ffaa00" :
        "#00ffff"

    // layered rings = fake 3D cone
    for(let i = 0; i < 4; i++){

        setTimeout(() => {

            rings.push({
                lat: lat,
                lng: lng,
                maxR: 4 + (i * 2),
                color: color
            })

            if(rings.length > MAX_RINGS){
                rings.shift()
            }

            const allRings = rings.concat(shockwaves)

            if(allRings.length > 0){
                globe.ringsData(allRings)
            }

        }, i * 120)

    }
}

// ======================================================
// CYBER STORM ENGINE
// ======================================================

function createStorm(lat,lng){

// find nearby storm
let storm = storms.find(s =>
Math.abs(s.lat - lat) < 5 &&
Math.abs(s.lng - lng) < 5
)

if(!storm){

storm = {
lat:lat,
lng:lng,
points:[],
rotation:0
}

storms.push(storm)

}

// add point to storm
storm.points.push({
angle:Math.random()*Math.PI*2,
radius:0.5 + Math.random()
})

}

// animate storms
function animateStorms(){

const scene = globe.scene()

storms.forEach(storm => {

storm.rotation += 0.05

storm.points.forEach(p => {

p.angle += 0.05

const x = storm.lat + Math.cos(p.angle) * p.radius
const y = storm.lng + Math.sin(p.angle) * p.radius

// reuse packet visual
points.push({
lat:x,
lng:y,
size:0.3,
color:"#ff0033"
})

})

})

// limit points
if(points.length > MAX_POINTS){
points.splice(0, points.length - MAX_POINTS)
}

const allPoints = points.concat(packets).concat(satellites)

if(allPoints.length > 0){
    globe.pointsData(allPoints)
}

}

setInterval(animateStorms,80)



// ======================================================
// PACKET STREAM GENERATOR
// ======================================================

function createPacketStream(lat,lng){

const count = 6

for(let i=0;i<count;i++){

packets.push({

startLat:lat,
startLng:lng,

lat:lat,
lng:lng,

progress:0,

size:0.35,
color:"#00ffff"

})

}

}

// ======================================================
// PACKET ANIMATION ENGINE
// ======================================================

function animatePackets(){

for(let i=packets.length-1;i>=0;i--){

let p = packets[i]

p.progress += 0.02

p.lat = p.startLat + (SOC_LAT - p.startLat) * p.progress
p.lng = p.startLng + (SOC_LON - p.startLng) * p.progress

if(p.progress >= 1){
packets.splice(i,1)
}

}

// update render layer
const allPoints = points.concat(packets).concat(satellites)

if(allPoints.length > 0){
    globe.pointsData(allPoints)
}

}

setInterval(animatePackets,50)

// ======================================================
// FOCUS CAMERA ON ATTACK
// ======================================================

function focusAttack(lat,lng){

globe.pointOfView({

lat:lat,
lng:lng,
altitude:1.5

},800)

}

// ======================================================
// GLOBAL ATTACK SHOCKWAVE
// ======================================================

function createShockwave(lat,lng){

shockwaves.push({

lat:lat,
lng:lng,
maxR:30,
color:"#ff0033"

})

if(shockwaves.length > 50){
shockwaves.shift()
}

const allRings = rings.concat(shockwaves)

if(allRings.length > 0){
    globe.ringsData(allRings)
}

}

// ======================================================
// SOC DEFENSE SHIELD (STABLE)
// ======================================================

function createShieldPulse(){

    for(let i = 0; i < 3; i++){

        setTimeout(() => {

            rings.push({
                lat: SOC_LAT,
                lng: SOC_LON,
                maxR: 8 + (i * 6),
                color: "#00ffff"
            })

            if(rings.length > MAX_RINGS){
                rings.shift()
            }

            const allRings = rings.concat(shockwaves)

            if(allRings.length > 0){
                globe.ringsData(allRings)
            }

        }, i * 150)

    }
}



// ======================================================
// SATELLITE NETWORK
// ======================================================

function initSatellites(){

for(let i=0;i<12;i++){

satellites.push({

lat:(Math.random()*180)-90,
lng:(Math.random()*360)-180,
size:0.6,
color:"#00ffff",
altitude:0.25

})

}

const allPoints = points.concat(packets).concat(satellites)

if(allPoints.length > 0){
    globe.pointsData(allPoints)
}

}

initSatellites()

// ======================================================
// SATELLITE ORBIT ENGINE
// ======================================================

function animateSatellites(){

satellites.forEach(s => {

s.lng += 0.15

if(s.lng > 180){
s.lng = -180
}

})

const allPoints = points.concat(packets).concat(satellites)

if(allPoints.length > 0){
    globe.pointsData(allPoints)
}

}

setInterval(animateSatellites,60)

// ======================================================
// SATELLITE TRACKING BEAMS
// ======================================================

function createSatelliteBeam(lat,lng){

satellites.forEach(s => {

arcs.push({

startLat:s.lat,
startLng:s.lng,

endLat:lat,
endLng:lng,

color:["#00ffff","#00ffff"]

})

})

// limit arcs
if(arcs.length > MAX_ARCS){
arcs.splice(0, arcs.length - MAX_ARCS)
}

if(arcs.length > 0){
    globe.arcsData(arcs)
}

}

// ======================================================
// SWARM BURST
// ======================================================

function createSwarmBurst(lat,lng){

for(let i=0;i<5;i++){

setTimeout(()=>{

rings.push({

lat:lat,
lng:lng,
maxR:6+Math.random()*4

})

// keep ring list bounded
if(rings.length > MAX_RINGS){
rings.shift()
}

globe.ringsData(rings.concat(shockwaves))

},i*120)

}

}


// ======================================================
// THREAT FLASH
// ======================================================

function createThreatFlash(lat,lng){

points.push({

lat:lat,
lng:lng,
size:1.5,
color:"#ff0033"

})

// keep list bounded
if(points.length > MAX_POINTS){
points.shift()
}

globe.pointsData(points.concat(packets).concat(satellites) || [])

setTimeout(()=>{

points.shift()
globe.pointsData(points.concat(packets).concat(satellites) || [])

},800)

}

// ======================================================
// AI THREAT CLASSIFIER
// ======================================================

function classifyThreat(alert){

if(!alert.technique) return null

const t = alert.technique.toLowerCase()

if(t.includes("scan")) return "#00ffff"
if(t.includes("exploit")) return "#ff5500"
if(t.includes("beacon")) return "#aa00ff"

return null

}

// ======================================================
// THREAT SCORING ENGINE
// ======================================================

function calculateRiskScore(alert){

    let score = 0

    // severity weight
    if(alert.severity === "CRITICAL") score += 50
    else if(alert.severity === "HIGH") score += 30
    else if(alert.severity === "MEDIUM") score += 15

    // technique weighting
    if(alert.technique){
        const t = alert.technique.toLowerCase()

        if(t.includes("exploit")) score += 25
        if(t.includes("brute")) score += 15
        if(t.includes("scan")) score += 5
        if(t.includes("lateral")) score += 20
    }

    // repeat offender boost (cluster proximity)
    const nearby = clusters.find(c =>
        Math.abs(c.lat - alert.latitude) < 2 &&
        Math.abs(c.lng - alert.longitude) < 2
    )

    if(nearby){
        score += Math.min(nearby.count * 2, 20)
    }

    return Math.min(score, 100)
}

// ======================================================
// HEATMAP UPDATE
// ======================================================

function addHeat(lat,lng){

heatmap.push({
lat:lat,
lng:lng,
weight:1
})

// limit heatmap growth
if(heatmap.length > 1500){
heatmap.shift()
}

globe.heatmapsData([heatmap])

}

// ======================================================
// TIMELINE SCRUB
// ======================================================

function scrubTimeline(index){

    isLiveMode = false
    isReplaying = false
    isScrubbing = true

    replayIndex = parseInt(index)

    // RESET VISUAL STATE
    arcs = []
    rings = []
    points = []
    heatmap = []
    clusters = []
    timelineMarkers = []

    globe.arcsData(arcs)
    globe.ringsData([])
    globe.pointsData([])

    // rebuild timeline up to selected point
    for(let i = 0; i <= replayIndex; i++){

        renderReplayEvent(replayEvents[i])

    }

    // update displayed time
    const current = replayEvents[replayIndex]

    if(current){
        document.getElementById("timelineTime").innerText =
            formatTime(current.ts)
    }

    isScrubbing = false   // ✅ ADD HERE (VERY BOTTOM, before function ends)
}

// ======================================================
// INTELLIGENCE ENGINE
// ======================================================

let clusters = []
let CLUSTER_RADIUS = 5      // degrees
let CLUSTER_TIME_WINDOW = 60000 // 60 seconds
let CLUSTER_THRESHOLD = 5   // events to trigger cluster

let timelineMarkers = []

// ======================================================
// TIMELINE EVENT SELECTION (INTELLIGENCE MODE)
// ======================================================

function selectTimelineEvent(index){

    const event = replayEvents[index]

    if(!event) return

    console.log("Selected timeline event:", event)

    // focus camera
    focusAttack(event.latitude, event.longitude)

    // open attack panel
    openAttackPanel({
        severity: event.severity,
        technique: event.technique,
        country: event.country_code,
        timestamp: event.timestamp
    })
}


// ======================================================
// PROCESS ALERT
// ======================================================

function processAlert(alert){

    const lat = parseFloat(alert.latitude)
    const lng = parseFloat(alert.longitude)
    alert.riskScore = calculateRiskScore(alert)

    // ❌ DO NOT PROCESS INVALID DATA
    if(!lat || !lng) return

    // ==================================================
    // APPLY FILTER BEFORE RENDERING
    // ==================================================

    if(!activeSeverities[alert.severity]) return

    if(activeCountryFilter &&
    !(alert.country_code || "").includes(activeCountryFilter)) return

    if(activeTechniqueFilter &&
    !(alert.technique || "").toLowerCase().includes(activeTechniqueFilter)) return

    // ==================================================
    // ✅ ADD TO UI QUEUE (AFTER VALIDATION)
    // ==================================================

    alertUIQueue.unshift({
        ...alert,
        status: "NEW"
    })

    if(alertUIQueue.length > 50){
        alertUIQueue.pop()
    }

    renderAlertQueue()

    // ==================================================
    // VISUALIZATION
    // ==================================================

    const classifiedColor = classifyThreat(alert)

    createAttackBeam(
        lat,
        lng,
        alert.severity,
        classifiedColor,
        alert
    )

    createReverseTrace(lat,lng)
    createSwarmBurst(lat,lng)
    createThreatFlash(lat,lng)
    addHeat(lat,lng)
    focusAttack(lat,lng)
    createPacketStream(lat,lng)
    createStorm(lat,lng)
    createSatelliteBeam(lat,lng)

    if(alert.severity === "HIGH" || alert.severity === "CRITICAL"){
        createAttackVolume(lat, lng, alert.severity)
        createShieldPulse()
    }

    if(alert.severity === "CRITICAL"){
        createShockwave(lat,lng)
    }

    // ==================================================
    // STATS
    // ==================================================

    if(alert.severity && severityStats[alert.severity] !== undefined){
        severityStats[alert.severity]++
    }

    if(alert.country_code){
        countryStats[alert.country_code] =
        (countryStats[alert.country_code] || 0) + 1
    }

    updateSOCPanel()

    // 🔴 CRITICAL MARKER
    if(alert.severity === "CRITICAL"){
        addTimelineMarker(alert, "CRITICAL")
    }

    detectCluster(alert)
}

// ======================================================
// REPLAY RENDER (NO SIDE EFFECTS)
// ======================================================

function renderReplayEvent(alert){

    alert.riskScore = calculateRiskScore(alert)

    const lat = alert.latitude
    const lng = alert.longitude

    if(!lat || !lng) return

    const classifiedColor = classifyThreat(alert)

    createAttackBeam(lat, lng, alert.severity, classifiedColor, alert)
    createReverseTrace(lat,lng)
    createSwarmBurst(lat,lng)
    createThreatFlash(lat,lng)
    addHeat(lat,lng)
    createPacketStream(lat,lng)
    createStorm(lat,lng)
    createSatelliteBeam(lat,lng)

    if(alert.severity === "HIGH" || alert.severity === "CRITICAL"){
        createAttackVolume(lat, lng, alert.severity)
        createShieldPulse()
    }

    if(alert.severity === "CRITICAL"){
        createShockwave(lat,lng)
    }

    // 🔴 CRITICAL MARKER (REPLAY SAFE)
    if(alert.severity === "CRITICAL"){
        addTimelineMarker(alert, "CRITICAL")
    }

    // ✅ ADD THIS LINE RIGHT HERE
    detectCluster(alert)

    }

// ======================================================
// CLUSTER DETECTION (CAMPAIGN INTELLIGENCE)
// ======================================================

function detectCluster(alert){

    const now = new Date(alert.timestamp || Date.now()).getTime()

    let cluster = clusters.find(c =>

        Math.abs(c.lat - alert.latitude) < CLUSTER_RADIUS &&
        Math.abs(c.lng - alert.longitude) < CLUSTER_RADIUS &&
        (now - c.lastSeen) < CLUSTER_TIME_WINDOW
    )

    if(!cluster){

        cluster = {
            lat: alert.latitude,
            lng: alert.longitude,
            count: 0,
            lastSeen: now,
            events: [],
            risk: 0,
            triggered: false
        }

        clusters.push(cluster)
    }

    cluster.count++
    cluster.lastSeen = now
    cluster.events.push(alert)
    cluster.risk += alert.riskScore

    // 🔴 TRIGGER CLUSTER EVENT
    if(cluster.count >= CLUSTER_THRESHOLD && !cluster.triggered){

        cluster.triggered = true

        console.log("🚨 CLUSTER DETECTED", cluster)

        createClusterMarker(cluster)
        addTimelineMarker(alert, "CLUSTER")

    }
}

// ======================================================
// CLUSTER VISUALIZATION
// ======================================================

function createClusterMarker(cluster){

    let color = "#ff00ff"

    if(cluster.risk > 300) color = "#ff0033"
    else if(cluster.risk > 150) color = "#ff5500"

    rings.push({
        lat: cluster.lat,
        lng: cluster.lng,
        maxR: 12,
        color: color
    })


    points.push({
        lat: cluster.lat,
        lng: cluster.lng,
        size: 2,
        color: color
    })

    globe.ringsData(rings.concat(shockwaves))
    globe.pointsData(points.concat(packets).concat(satellites))
}

// ======================================================
// TIMELINE MARKERS
// ======================================================

function addTimelineMarker(alert, type){

    const index = replayEvents.length - 1

    // ❌ prevent duplicates
    const exists = timelineMarkers.find(m =>
        m.index === index && m.type === type
    )

    if(exists) return

    timelineMarkers.push({
        index: index,
        type: type,
        time: alert.timestamp
    })

    renderTimelineMarkers()
}

function renderTimelineMarkers(){

    const container = document.getElementById("timelineMarkers")

    if(!container) return

    container.innerHTML = ""

    const total = replayEvents.length

    timelineMarkers.forEach(marker => {

        const percent = total > 0 ? (marker.index / total) * 100 : 0

        const el = document.createElement("div")

        el.className = "marker " + marker.type.toLowerCase()
        el.style.left = percent + "%"

        // 🖱 CLICK → JUMP TO EVENT
        el.onclick = () => {

            const slider = document.getElementById("timelineSlider")

            slider.value = marker.index

            scrubTimeline(marker.index)
            selectTimelineEvent(marker.index)

        }

        container.appendChild(el)
    })
}



// ======================================================
// RENDER ALERT QUEUE
// ======================================================

function renderAlertQueue(){

    const container = document.getElementById("alertQueueList")

    let html = ""

    alertUIQueue
    .filter(alert => {

        if(!activeSeverities[alert.severity]) return false

        if(activeCountryFilter &&
           !(alert.country_code || "").includes(activeCountryFilter)) return false

        if(activeTechniqueFilter &&
           !(alert.technique || "").toLowerCase().includes(activeTechniqueFilter)) return false

        return true
    })
    .forEach((alert) => {

        const color =
            alert.severity === "CRITICAL" ? "#ff0033" :
            alert.severity === "HIGH" ? "#ff5500" :
            alert.severity === "MEDIUM" ? "#ffaa00" :
            "#00ffff"

        html += `
        <div style="border-bottom:1px solid #222; padding:6px;">

            <div style="color:${color}; font-size:12px;">
                ${alert.severity} - ${alert.technique || "unknown"}
            </div>

            <div style="font-size:10px; color:#999;">
                ${alert.status}
            </div>

            <div style="font-size:11px;">
                ${alert.country_code || "??"}
            </div>

            <div style="margin-top:4px;">
                <button onclick="ackAlert('${alert.id}')">✅</button>
                <button onclick="escalateAlert('${alert.id}')">🚨</button>
            </div>

        </div>
        `
    })

    container.innerHTML = html
}

// ======================================================
// ALERT ACTIONS (ID-BASED)
// ======================================================

function ackAlert(id){

    const alert = alertUIQueue.find(a => a.id === id)
    if(!alert) return

    alert.status = "ACK"

    fetch("/alerts/update-status", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            id: id,
            status: "ACK"
        })
    })

    renderAlertQueue()
}

function escalateAlert(id){

    const alert = alertUIQueue.find(a => a.id === id)
    if(!alert) return

    alert.status = "ESCALATED"

    fetch("/alerts/update-status", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            id: id,
            status: "ESCALATED"
        })
    })

    renderAlertQueue()
}

// ======================================================
// FILTER LOGIC
// ======================================================

function toggleSeverity(level){

}

function applyFilters(){

    activeCountryFilter = document.getElementById("countryFilter").value.toUpperCase()
    activeTechniqueFilter = document.getElementById("techniqueFilter").value.toLowerCase()

    renderAlertQueue()
}

// ======================================================
// QUEUE PROCESSOR
// ======================================================

function processQueue(){

if(alertQueue.length===0) return

const alert=alertQueue.shift()

}

setInterval(processQueue,120)

function formatTime(date){
    if(!date) return "--:--:--"
    return new Date(date).toLocaleTimeString()
}

// ======================================================
// REPLAY ENGINE
// ======================================================

function startReplay(){

    if(replayEvents.length === 0){
        console.warn("No events to replay")
        return
    }

    isLiveMode = false
    isReplaying = true
    isScrubbing = false

    // reset visual state
    arcs = []
    rings = []
    points = []
    heatmap = []

    globe.arcsData(arcs)
    globe.ringsData([])
    globe.pointsData([])

    replayIndex = parseInt(document.getElementById("timelineSlider").value) || 0
}

function pauseReplay(){
    isReplaying = false
}

function resetReplay(){
    isReplaying = false
    replayIndex = 0
}

function goLive(){

    isLiveMode = true
    isReplaying = false
    isScrubbing = false

    replayIndex = replayEvents.length - 1

    const slider = document.getElementById("timelineSlider")
    slider.value = replayIndex

    console.log("Switched to LIVE mode")
}

function setSpeed(speed){
    replaySpeed = speed
    startReplayTimer()
    console.log("Replay speed set:", speed)
}

function replayLoop(){

    if(!isReplaying) return

    if(replayIndex >= replayEvents.length){
        isReplaying = false
        return
    }

    const event = replayEvents[replayIndex]

    // render WITHOUT side effects
    renderReplayEvent(event)

    // subtle highlight
    createThreatFlash(event.latitude, event.longitude)

    // update UI
    document.getElementById("timelineSlider").value = replayIndex


    document.getElementById("timelineTime").innerText =
        `${formatTime(event.ts)} | ${event.technique || "unknown"}`

    replayIndex++
}

let replayTimer = null

function startReplayTimer(){
    if(replayTimer) clearInterval(replayTimer)
    replayTimer = setInterval(replayLoop, replaySpeed)
}

// start initially
startReplayTimer()

// ======================================================
// ATTACK PANEL LOGIC (MITRE ENABLED)
// ======================================================

function openAttackPanel(attack){

    document.getElementById("attackPanel").classList.remove("hidden")

    // Basic info
    document.getElementById("panelSeverity").innerText = attack.severity || "N/A"
    const readableTechnique = (attack.technique || "unknown")
    .replace(/_/g, " ")
    .replace(/\b\w/g, c => c.toUpperCase())

    document.getElementById("panelTechnique").innerText = readableTechnique
    document.getElementById("panelCountry").innerText = attack.country || "Unknown"
    document.getElementById("panelTime").innerText =
        new Date(attack.timestamp || Date.now()).toLocaleString()

    document.getElementById("panelRisk").innerText =
        attack.riskScore !== undefined ? attack.riskScore : "N/A"

    // Normalize technique → key
    const key = (attack.technique || "")
        .toLowerCase()
        .replace(/\s+/g, "_")

    const mitre = MITRE_MAP[key]

    if(mitre){
        document.getElementById("panelMitreId").innerText = mitre.id
        document.getElementById("panelMitreTactic").innerText = mitre.tactic
        document.getElementById("panelMitreDesc").innerText = mitre.description
    } else {
        document.getElementById("panelMitreId").innerText = "N/A"
        document.getElementById("panelMitreTactic").innerText = "Unknown"
        document.getElementById("panelMitreDesc").innerText = "No mapping available"
    }
}

function closeAttackPanel(){
    document.getElementById("attackPanel").classList.add("hidden")
}


// ======================================================
// WEBSOCKET STREAM
// ======================================================

const protocol=location.protocol==="https:"?"wss":"ws"

const ws=new WebSocket(`${protocol}://${location.host}/ws`)

ws.onmessage=e=>{

try{

const msg=JSON.parse(e.data)

if(msg.type==="batch" && Array.isArray(msg.events)){

msg.events.forEach(alert=>{

    // STORE FOR REPLAY (ONLY HERE)
    replayEvents.push({
        ...alert,
        latitude: parseFloat(alert.latitude),
        longitude: parseFloat(alert.longitude),
        ts: new Date(alert.timestamp || Date.now())
    })

    const slider = document.getElementById("timelineSlider")

    slider.max = replayEvents.length - 1

    if(!isScrubbing && !isReplaying){
        slider.value = replayEvents.length - 1
    }

    // AUTO FOLLOW LIVE
    if(isLiveMode){
        replayIndex = replayEvents.length - 1

        const slider = document.getElementById("timelineSlider")
        slider.value = replayIndex
    }

    if(alertQueue.length>MAX_QUEUE){
        EVENT_DROP_COUNT++
    }else{
        alertQueue.push(alert)
    }

})}

}catch(err){

console.error("WebSocket error",err)

}

}


// ======================================================
// LOAD DATABASE ALERTS
// ======================================================

async function load(){

const data=await fetch("/alerts").then(r=>r.json())

if(!Array.isArray(data)){
console.warn("Alerts response not array",data)
return
}

data.forEach(alert=>{

    // STORE FOR REPLAY
    replayEvents.push({
        ...alert,
        latitude: parseFloat(alert.latitude),
        longitude: parseFloat(alert.longitude),
        ts: new Date(alert.timestamp || Date.now())
    })

    const slider = document.getElementById("timelineSlider")

    slider.max = replayEvents.length - 1

    if(!isScrubbing && !isReplaying){
        slider.value = replayEvents.length - 1
    }

    processAlert(alert)

})

}

async function loadIncidents(){

    try{

        const data = await fetch("/incidents").then(r => r.json())

        incidents = data.map(i => ({

            lat: i.lat,
            lng: i.lng,

            size: 1.8 + (i.count * 0.25),

            color:
                i.risk > 200 ? "#ff0033" :
                i.risk > 100 ? "#ff5500" :
                "#ff00ff"

        }))

        globe.pointsData(
            points.concat(packets).concat(satellites).concat(incidents)
        )

    }catch(err){
        console.error("Incident load failed", err)
    }
}

load()
