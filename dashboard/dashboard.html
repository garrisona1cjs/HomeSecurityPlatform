<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>LayerSeven Security Platform</title>



<script src="https://unpkg.com/globe.gl"></script>

<style>

body{
  margin:0;
  background:black;
  overflow:hidden;
  font-family:Arial;
}

/* ======================================================
SOC PANEL
====================================================== */

#socPanel{
  position:absolute;
  top:20px;
  left:20px;
  width:220px;
  background:rgba(0,0,0,0.7);
  border:1px solid #00ffff;
  padding:14px;
  color:#00ffff;
  font-size:14px;
  backdrop-filter:blur(6px);
}

.panelTitle{
  font-weight:bold;
  margin-top:10px;
  margin-bottom:6px;
  color:#ffffff;
}

.metric{
  display:flex;
  justify-content:space-between;
  margin-bottom:4px;
}

#countryList{
  margin-top:8px;
  font-size:13px;
}

#globeViz{
  width:100vw;
  height:100vh;
}

/* ======================================================
ATTACK PANEL STYLE
====================================================== */

.attack-panel {
    position: absolute;
    right: 20px;
    top: 80px;
    width: 280px;
    background: rgba(0, 0, 0, 0.85);
    border: 1px solid #00ffff;
    border-radius: 10px;
    box-shadow: 0 0 15px rgba(0,255,255,0.3);
    color: #00ffff;
    font-family: monospace;
    z-index: 9999;
    backdrop-filter: blur(6px);
}

.attack-panel.hidden {
    display: none;
}

.panel-header {
    display: flex;
    justify-content: space-between;
    padding: 10px;
    border-bottom: 1px solid rgba(0,255,255,0.2);
    font-weight: bold;
}

.panel-header button {
    background: none;
    border: none;
    color: #ff4d4d;
    cursor: pointer;
}

.panel-content {
    padding: 10px;
}

.panel-content p {
    margin: 5px 0;
}

</style>

</head>

<body>

<div id="globeViz"></div>

<!-- ======================================================
SOC PANEL
====================================================== -->

<div id="socPanel">

<div class="panelTitle">SOC LIVE TELEMETRY</div>

<div class="metric">
<span>CRITICAL</span>
<span id="criticalCount">0</span>
</div>

<div class="metric">
<span>HIGH</span>
<span id="highCount">0</span>
</div>

<div class="metric">
<span>MEDIUM</span>
<span id="mediumCount">0</span>
</div>

<div class="panelTitle">TOP ATTACK COUNTRIES</div>

<div id="countryList"></div>









<div class="panelTitle">REPLAY CONTROLS</div>

<button onclick="startReplay()">▶ Play</button>
<button onclick="pauseReplay()">⏸ Pause</button>
<button onclick="resetReplay()">🔄 Reset</button>




<div class="panelTitle">TIMELINE</div>

<input id="timelineSlider"
       type="range"
       min="0"
       max="0"
       value="0"
       style="width:100%"
       oninput="scrubTimeline(this.value)">

<div id="timelineTime" style="margin-top:6px; font-size:12px; color:#ffffff;">
--:--:--
</div>

</div> <!-- END socPanel -->


<!-- ======================================================
ATTACK DETAILS PANEL
====================================================== -->

<div id="attackPanel" class="attack-panel hidden">
    <div class="panel-header">
        <span>⚠️ Attack Details</span>
        <button onclick="closeAttackPanel()">✖</button>
    </div>

    <div class="panel-content">
        <p><strong>Severity:</strong> <span id="panelSeverity"></span></p>
        <p><strong>Technique:</strong> <span id="panelTechnique"></span></p>

        <p><strong>MITRE ID:</strong> <span id="panelMitreId"></span></p>
        <p><strong>Tactic:</strong> <span id="panelMitreTactic"></span></p>
        <p><strong>Description:</strong></p>
        <p id="panelMitreDesc" style="font-size:12px;"></p>

        <p><strong>Country:</strong> <span id="panelCountry"></span></p>
        <p><strong>Timestamp:</strong> <span id="panelTime"></span></p>
    </div>
</div>


<script>




// ======================================================
// SUPPRESS NON-CRITICAL THREE / WEBGL WARNINGS (FULL FIX)
// ======================================================

const originalWarn = console.warn
const originalError = console.error

function shouldSuppress(msg){
    return (
        msg.includes("THREE.Clock") ||
        msg.includes("Binding size") ||
        msg.includes("BindGroup") ||
        msg.includes("Invalid CommandBuffer") ||
        msg.includes("computeGroup")
    )
}

// suppress warnings
console.warn = function(...args){
    const msg = args.join(" ")
    if (shouldSuppress(msg)) return
    originalWarn.apply(console, args)
}

// suppress errors (WebGL spam)
console.error = function(...args){
    const msg = args.join(" ")
    if (shouldSuppress(msg)) return
    originalError.apply(console, args)
}



// ======================================================
// SOC LOCATION
// ======================================================

const SOC_LAT = 41.5868
const SOC_LON = -93.6250


// ======================================================
// DATA STORES
// ======================================================

let arcs = []
let rings = []
let points = []

// heatmap attack density
let heatmap = []

// animated network packets
let packets = []

// global shockwaves
let shockwaves = []

// security satellites
let satellites = []







// ======================================================
// ADVANCED SYSTEMS
// ======================================================

let storms = []
let satelliteBeams = []

// ======================================================
// SOC STATISTICS
// ======================================================

let severityStats = {

CRITICAL:0,
HIGH:0,
MEDIUM:0

}

let countryStats = {}

let alertQueue = []

// ======================================================
// REPLAY SYSTEM
// ======================================================

let replayEvents = []
let replayIndex = 0
let isReplaying = false
let replaySpeed = 300

let isScrubbing = false   // ✅ ADD THIS LINE RIGHT HERE

// SOC visual safety limits
const MAX_ARCS = 500
const MAX_RINGS = 400
const MAX_POINTS = 200

const MAX_QUEUE = 2000
let EVENT_DROP_COUNT = 0


// ======================================================
// CREATE GLOBE
// ======================================================

const globe = Globe()(document.getElementById("globeViz"))





// ======================================================
// CONFIGURE GLOBE
// ======================================================

globe
.globeImageUrl("//unpkg.com/three-globe/example/img/earth-night.jpg")
.backgroundColor("black")

.arcsData(arcs)
.arcColor("color")
.arcAltitude(0.25)
.arcStroke(0.8)
.onArcClick(d => {

    if(isScrubbing) return

    openAttackPanel(d)

})
.arcDashLength(0.4)
.arcDashGap(4)
.arcDashAnimateTime(1200)

.ringsData(rings.concat(shockwaves))
.ringMaxRadius("maxR")
.ringPropagationSpeed(2)
.ringColor(d => d.color || "#ff0033")

.pointsData(points.concat(packets).concat(satellites))
.pointAltitude(0)
.pointRadius("size")
.pointColor("color")






// ======================================================
// HEATMAP LAYER
// ======================================================

.heatmapsData([heatmap])
.heatmapBandwidth(2.5)
.heatmapColorSaturation(0.9)













// ======================================================
// ATTACK BEAM
// ======================================================

function createAttackBeam(lat, lng, severity, classifiedColor, alert){

const color = classifiedColor ||
(
severity === "CRITICAL" ? "#ff0033" :
severity === "HIGH" ? "#ff5500" :
severity === "MEDIUM" ? "#ffaa00" :
"#00ffff"
)

arcs.push({

    startLat:lat,
    startLng:lng,

    endLat:SOC_LAT,
    endLng:SOC_LON,

    color:[color,color],

    // ✅ REAL DATA FROM BACKEND
    severity: alert.severity,
    technique: alert.technique,
    country: alert.country_code || "Unknown",
    timestamp: alert.timestamp || Date.now()

})

// limit arcs
if(arcs.length > MAX_ARCS){
    arcs.shift()
}

globe.arcsData(arcs)

}

// ======================================================
// REVERSE ATTACK TRACE
// ======================================================

function createReverseTrace(lat,lng){

arcs.push({

startLat:SOC_LAT,
startLng:SOC_LON,

endLat:lat,
endLng:lng,

color:["#00ffff","#00ffff"]

})

if(arcs.length > MAX_ARCS){
arcs.shift()
}

globe.arcsData(arcs)

}

// ======================================================
// VOLUMETRIC ATTACK (STABLE - NO THREE)
// ======================================================

function createAttackVolume(lat, lng, severity){

    const color =
        severity === "CRITICAL" ? "#ff0033" :
        severity === "HIGH" ? "#ff5500" :
        severity === "MEDIUM" ? "#ffaa00" :
        "#00ffff"

    // layered rings = fake 3D cone
    for(let i = 0; i < 4; i++){

        setTimeout(() => {

            rings.push({
                lat: lat,
                lng: lng,
                maxR: 4 + (i * 2),
                color: color
            })

            if(rings.length > MAX_RINGS){
                rings.shift()
            }

            globe.ringsData(rings.concat(shockwaves))

        }, i * 120)

    }
}

// ======================================================
// CYBER STORM ENGINE
// ======================================================

function createStorm(lat,lng){

// find nearby storm
let storm = storms.find(s =>
Math.abs(s.lat - lat) < 5 &&
Math.abs(s.lng - lng) < 5
)

if(!storm){

storm = {
lat:lat,
lng:lng,
points:[],
rotation:0
}

storms.push(storm)

}

// add point to storm
storm.points.push({
angle:Math.random()*Math.PI*2,
radius:0.5 + Math.random()
})

}

// animate storms
function animateStorms(){

const scene = globe.scene()

storms.forEach(storm => {

storm.rotation += 0.05

storm.points.forEach(p => {

p.angle += 0.05

const x = storm.lat + Math.cos(p.angle) * p.radius
const y = storm.lng + Math.sin(p.angle) * p.radius

// reuse packet visual
points.push({
lat:x,
lng:y,
size:0.3,
color:"#ff0033"
})

})

})

// limit points
if(points.length > MAX_POINTS){
points.splice(0, points.length - MAX_POINTS)
}

globe.pointsData(points.concat(packets).concat(satellites) || [])

}

setInterval(animateStorms,80)



// ======================================================
// PACKET STREAM GENERATOR
// ======================================================

function createPacketStream(lat,lng){

const count = 6

for(let i=0;i<count;i++){

packets.push({

startLat:lat,
startLng:lng,

lat:lat,
lng:lng,

progress:0,

size:0.35,
color:"#00ffff"

})

}

}

// ======================================================
// PACKET ANIMATION ENGINE
// ======================================================

function animatePackets(){

for(let i=packets.length-1;i>=0;i--){

let p = packets[i]

p.progress += 0.02

p.lat = p.startLat + (SOC_LAT - p.startLat) * p.progress
p.lng = p.startLng + (SOC_LON - p.startLng) * p.progress

if(p.progress >= 1){
packets.splice(i,1)
}

}

// update render layer
globe.pointsData(points.concat(packets).concat(satellites) || [])

}

setInterval(animatePackets,50)

// ======================================================
// FOCUS CAMERA ON ATTACK
// ======================================================

function focusAttack(lat,lng){

globe.pointOfView({

lat:lat,
lng:lng,
altitude:1.5

},800)

}

// ======================================================
// GLOBAL ATTACK SHOCKWAVE
// ======================================================

function createShockwave(lat,lng){

shockwaves.push({

lat:lat,
lng:lng,
maxR:30,
color:"#ff0033"

})

if(shockwaves.length > 50){
shockwaves.shift()
}

globe.ringsData(rings.concat(shockwaves))

}

// ======================================================
// SOC DEFENSE SHIELD (STABLE)
// ======================================================

function createShieldPulse(){

    for(let i = 0; i < 3; i++){

        setTimeout(() => {

            rings.push({
                lat: SOC_LAT,
                lng: SOC_LON,
                maxR: 8 + (i * 6),
                color: "#00ffff"
            })

            if(rings.length > MAX_RINGS){
                rings.shift()
            }

            globe.ringsData(rings.concat(shockwaves))

        }, i * 150)

    }
}



// ======================================================
// SATELLITE NETWORK
// ======================================================

function initSatellites(){

for(let i=0;i<12;i++){

satellites.push({

lat:(Math.random()*180)-90,
lng:(Math.random()*360)-180,
size:0.6,
color:"#00ffff",
altitude:0.25

})

}

globe.pointsData(points.concat(packets).concat(satellites) || [])

}

initSatellites()

// ======================================================
// SATELLITE ORBIT ENGINE
// ======================================================

function animateSatellites(){

satellites.forEach(s => {

s.lng += 0.15

if(s.lng > 180){
s.lng = -180
}

})

globe.pointsData(points.concat(packets).concat(satellites) || [])

}

setInterval(animateSatellites,60)

// ======================================================
// SATELLITE TRACKING BEAMS
// ======================================================

function createSatelliteBeam(lat,lng){

satellites.forEach(s => {

arcs.push({

startLat:s.lat,
startLng:s.lng,

endLat:lat,
endLng:lng,

color:["#00ffff","#00ffff"]

})

})

// limit arcs
if(arcs.length > MAX_ARCS){
arcs.splice(0, arcs.length - MAX_ARCS)
}

globe.arcsData(arcs)

}

// ======================================================
// SWARM BURST
// ======================================================

function createSwarmBurst(lat,lng){

for(let i=0;i<5;i++){

setTimeout(()=>{

rings.push({

lat:lat,
lng:lng,
maxR:6+Math.random()*4

})

// keep ring list bounded
if(rings.length > MAX_RINGS){
rings.shift()
}

globe.ringsData(rings.concat(shockwaves))

},i*120)

}

}


// ======================================================
// THREAT FLASH
// ======================================================

function createThreatFlash(lat,lng){

points.push({

lat:lat,
lng:lng,
size:1.5,
color:"#ff0033"

})

// keep list bounded
if(points.length > MAX_POINTS){
points.shift()
}

globe.pointsData(points.concat(packets).concat(satellites) || [])

setTimeout(()=>{

points.shift()
globe.pointsData(points.concat(packets).concat(satellites) || [])

},800)

}

// ======================================================
// AI THREAT CLASSIFIER
// ======================================================

function classifyThreat(alert){

if(!alert.technique) return null

const t = alert.technique.toLowerCase()

if(t.includes("scan")) return "#00ffff"
if(t.includes("exploit")) return "#ff5500"
if(t.includes("beacon")) return "#aa00ff"

return null

}

// ======================================================
// HEATMAP UPDATE
// ======================================================

function addHeat(lat,lng){

heatmap.push({
lat:lat,
lng:lng,
weight:1
})

// limit heatmap growth
if(heatmap.length > 1500){
heatmap.shift()
}

globe.heatmapsData([heatmap])

}

// ======================================================
// TIMELINE SCRUB
// ======================================================

function scrubTimeline(index){

    isReplaying = false

    isScrubbing = true   // ✅ ADD HERE (VERY TOP, after stopping replay)

    replayIndex = parseInt(index)

    // RESET VISUAL STATE
    arcs = []
    rings = []
    points = []
    heatmap = []

    globe.arcsData(arcs)
    globe.ringsData([])
    globe.pointsData([])

    // rebuild timeline up to selected point
    for(let i = 0; i <= replayIndex; i++){

        processAlert(replayEvents[i])

    }

    // update displayed time
    const current = replayEvents[replayIndex]

    if(current){
        document.getElementById("timelineTime").innerText =
            formatTime(current.ts)
    }

    isScrubbing = false   // ✅ ADD HERE (VERY BOTTOM, before function ends)
}


// ======================================================
// PROCESS ALERT
// ======================================================

function processAlert(alert){


const lat=parseFloat(alert.latitude)
const lng=parseFloat(alert.longitude)

if(!lat || !lng) return

// visualization
const classifiedColor = classifyThreat(alert)

createAttackBeam(
    lat,
    lng,
    alert.severity,
    classifiedColor,
    alert   // ✅ PASS FULL ALERT OBJECT
)
createReverseTrace(lat,lng)
createSwarmBurst(lat,lng)
createThreatFlash(lat,lng)
addHeat(lat,lng)
focusAttack(lat,lng)
createPacketStream(lat,lng)
createStorm(lat,lng)
createSatelliteBeam(lat,lng)

// volumetric + shield
if(alert.severity === "HIGH" || alert.severity === "CRITICAL"){
    createAttackVolume(lat, lng, alert.severity)
    createShieldPulse()
}



// critical shockwave
if(alert.severity === "CRITICAL"){
    createShockwave(lat,lng)
}

// track severity

if(alert.severity && severityStats[alert.severity] !== undefined){

severityStats[alert.severity]++


}

// track country

if(alert.country_code){

countryStats[alert.country_code] =

(countryStats[alert.country_code] || 0) + 1

}

updateSOCPanel()

}

// ======================================================
// UPDATE SOC PANEL
// ======================================================

function updateSOCPanel(){

document.getElementById("criticalCount").innerText = severityStats.CRITICAL
document.getElementById("highCount").innerText = severityStats.HIGH
document.getElementById("mediumCount").innerText = severityStats.MEDIUM

const list = Object.entries(countryStats)

.sort((a,b)=>b[1]-a[1])

.slice(0,5)

let html=""

list.forEach(([country,count])=>{

html += `<div>${country} : ${count}</div>`

})

document.getElementById("countryList").innerHTML = html

}


// ======================================================
// QUEUE PROCESSOR
// ======================================================

function processQueue(){

if(alertQueue.length===0) return

const alert=alertQueue.shift()

processAlert(alert)

}

setInterval(processQueue,120)

function formatTime(date){
    if(!date) return "--:--:--"
    return new Date(date).toLocaleTimeString()
}

// ======================================================
// REPLAY ENGINE
// ======================================================

function startReplay(){

    if(replayEvents.length === 0){
        console.warn("No events to replay")
        return
    }

    // RESET VISUAL STATE
    arcs = []
    rings = []
    points = []
    heatmap = []

    globe.arcsData(arcs)
    globe.ringsData([])
    globe.pointsData([])

    isReplaying = true
    replayIndex = 0
}

function pauseReplay(){
    isReplaying = false
}

function resetReplay(){
    isReplaying = false
    replayIndex = 0
}

function replayLoop(){

    if(!isReplaying) return

    if(replayIndex >= replayEvents.length){
        isReplaying = false
        return
    }

    const event = replayEvents[replayIndex]

    processAlert(event)

    // update slider
    document.getElementById("timelineSlider").value = replayIndex

    // update time display
    document.getElementById("timelineTime").innerText =
        formatTime(event.ts)

    replayIndex++
}

setInterval(replayLoop, replaySpeed)

// ======================================================
// MITRE ATT&CK MAPPING
// ======================================================

const MITRE_MAP = {

    "brute_force": {
        id: "T1110",
        tactic: "Credential Access",
        description: "Adversaries attempt to guess passwords or credentials."
    },

    "port_scan": {
        id: "T1046",
        tactic: "Discovery",
        description: "Scanning for open ports and exposed services."
    },

    "command_and_control": {
        id: "T1071",
        tactic: "Command and Control",
        description: "Application layer protocol used for C2 communication."
    },

    "data_exfiltration": {
        id: "T1041",
        tactic: "Exfiltration",
        description: "Data exfiltration over command channels."
    },

    "lateral_movement": {
        id: "T1021",
        tactic: "Lateral Movement",
        description: "Moving through the network to access other systems."
    }

}

// ======================================================
// ATTACK PANEL LOGIC (MITRE ENABLED)
// ======================================================

function openAttackPanel(attack){

    document.getElementById("attackPanel").classList.remove("hidden")

    // Basic info
    document.getElementById("panelSeverity").innerText = attack.severity || "N/A"
    const readableTechnique = (attack.technique || "unknown")
    .replace(/_/g, " ")
    .replace(/\b\w/g, c => c.toUpperCase())

    document.getElementById("panelTechnique").innerText = readableTechnique
    document.getElementById("panelCountry").innerText = attack.country || "Unknown"
    document.getElementById("panelTime").innerText =
        new Date(attack.timestamp || Date.now()).toLocaleString()

    // Normalize technique → key
    const key = (attack.technique || "")
        .toLowerCase()
        .replace(/\s+/g, "_")

    const mitre = MITRE_MAP[key]

    if(mitre){
        document.getElementById("panelMitreId").innerText = mitre.id
        document.getElementById("panelMitreTactic").innerText = mitre.tactic
        document.getElementById("panelMitreDesc").innerText = mitre.description
    } else {
        document.getElementById("panelMitreId").innerText = "N/A"
        document.getElementById("panelMitreTactic").innerText = "Unknown"
        document.getElementById("panelMitreDesc").innerText = "No mapping available"
    }
}

function closeAttackPanel(){
    document.getElementById("attackPanel").classList.add("hidden")
}


// ======================================================
// WEBSOCKET STREAM
// ======================================================

const protocol=location.protocol==="https:"?"wss":"ws"

const ws=new WebSocket(`${protocol}://${location.host}/ws`)

ws.onmessage=e=>{

try{

const msg=JSON.parse(e.data)

if(msg.type==="batch" && Array.isArray(msg.events)){

msg.events.forEach(alert=>{

    // STORE FOR REPLAY (ONLY HERE)
    replayEvents.push({
        ...alert,
        ts: new Date(alert.timestamp || Date.now())
    })

    document.getElementById("timelineSlider").max = replayEvents.length - 1

    if(alertQueue.length>MAX_QUEUE){
        EVENT_DROP_COUNT++
    }else{
        alertQueue.push(alert)
    }

})}

}catch(err){

console.error("WebSocket error",err)

}

}


// ======================================================
// LOAD DATABASE ALERTS
// ======================================================

async function load(){

const data=await fetch("/alerts").then(r=>r.json())

if(!Array.isArray(data)){
console.warn("Alerts response not array",data)
return
}

data.forEach(alert=>{

    // STORE FOR REPLAY
    replayEvents.push({
        ...alert,
        ts: new Date(alert.timestamp || Date.now())
    })

    document.getElementById("timelineSlider").max = replayEvents.length - 1

    processAlert(alert)

})

}


// ======================================================
// INITIAL LOAD
// ======================================================

load()

// ======================================================
// GLOBE ROTATION
// ======================================================

let rotationSpeed = 0.02

function rotateGlobe(){

const controls = globe.controls()

if(!controls) return

controls.autoRotate = true
controls.autoRotateSpeed = rotationSpeed

}

rotateGlobe()


// ======================================================
// WEBGL CONTEXT RECOVERY
// ======================================================

window.addEventListener("webglcontextlost",function(e){

console.warn("WebGL context lost - reloading dashboard")

e.preventDefault()

setTimeout(()=>{

location.reload()

},2000)

},false)

</script>

</body>
