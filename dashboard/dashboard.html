<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>LayerSeven Security Platform</title>

<script src="https://unpkg.com/three"></script>
<script src="https://unpkg.com/globe.gl"></script>

<style>

body{
  margin:0;
  background:black;
  overflow:hidden;
  font-family:Arial;
}

/* ======================================================
SOC PANEL
====================================================== */

#socPanel{

position:absolute;
top:20px;
left:20px;

width:220px;

background:rgba(0,0,0,0.7);
border:1px solid #00ffff;

padding:14px;

color:#00ffff;
font-size:14px;

backdrop-filter:blur(6px);

}

.panelTitle{

font-weight:bold;
margin-top:10px;
margin-bottom:6px;

color:#ffffff;

}

.metric{

display:flex;
justify-content:space-between;
margin-bottom:4px;

}

#countryList{

margin-top:8px;
font-size:13px;

}

#globeViz{
  width:100vw;
  height:100vh;
}

</style>

</head>

<body>

<div id="globeViz"></div>

<!-- ======================================================
SOC INTELLIGENCE PANEL
====================================================== -->

<div id="socPanel">

<div class="panelTitle">SOC LIVE TELEMETRY</div>

<div class="metric">
<span>CRITICAL</span>
<span id="criticalCount">0</span>
</div>

<div class="metric">
<span>HIGH</span>
<span id="highCount">0</span>
</div>

<div class="metric">
<span>MEDIUM</span>
<span id="mediumCount">0</span>
</div>

<div class="panelTitle">TOP ATTACK COUNTRIES</div>

<div id="countryList"></div>

</div>

<script>

// ======================================================
// SOC LOCATION
// ======================================================

const SOC_LAT = 41.5868
const SOC_LON = -93.6250


// ======================================================
// DATA STORES
// ======================================================

let arcs = []
let rings = []
let points = []

// heatmap attack density
let heatmap = []

// animated network packets
let packets = []

// ======================================================
// SOC STATISTICS
// ======================================================

let severityStats = {

CRITICAL:0,
HIGH:0,
MEDIUM:0

}

let countryStats = {}

let alertQueue = []

// SOC visual safety limits
const MAX_ARCS = 500
const MAX_RINGS = 400
const MAX_POINTS = 200

const MAX_QUEUE = 2000
let EVENT_DROP_COUNT = 0


// ======================================================
// CREATE GLOBE
// ======================================================

const globe = Globe()
(document.getElementById("globeViz"))

.globeImageUrl("//unpkg.com/three-globe/example/img/earth-night.jpg")
.backgroundColor("black")

.arcsData(arcs)
.arcColor("color")
.arcAltitude(0.25)
.arcStroke(0.8)
.arcDashLength(0.4)
.arcDashGap(4)
.arcDashAnimateTime(1200)

.ringsData(rings)
.ringMaxRadius("maxR")
.ringPropagationSpeed(2)

.pointsData(points)
.pointAltitude(0)
.pointRadius("size")
.pointColor("color")

// ======================================================
// PACKET STREAM LAYER
// ======================================================

.pointsData(points.concat(packets))

// ======================================================
// HEATMAP LAYER
// ======================================================

.heatmapsData([heatmap])
.heatmapBandwidth(2.5)
.heatmapColorSaturation(0.9)


// ======================================================
// ATTACK BEAM
// ======================================================

function createAttackBeam(lat,lng,severity){

const color =
severity === "CRITICAL" ? "#ff0033" :
severity === "HIGH" ? "#ff5500" :
severity === "MEDIUM" ? "#ffaa00" :
"#00ffff"

arcs.push({

startLat:lat,
startLng:lng,

endLat:SOC_LAT,
endLng:SOC_LON,

color:[color,color]

})

// keep arc list bounded
if(arcs.length > MAX_ARCS){
arcs.shift()
}

globe.arcsData(arcs)

}

// ======================================================
// PACKET STREAM GENERATOR
// ======================================================

function createPacketStream(lat,lng){

const count = 6

for(let i=0;i<count;i++){

packets.push({

startLat:lat,
startLng:lng,

lat:lat,
lng:lng,

progress:0,

size:0.35,
color:"#00ffff"

})

}

}

// ======================================================
// PACKET ANIMATION ENGINE
// ======================================================

function animatePackets(){

for(let i=packets.length-1;i>=0;i--){

let p = packets[i]

p.progress += 0.02

p.lat = p.startLat + (SOC_LAT - p.startLat) * p.progress
p.lng = p.startLng + (SOC_LON - p.startLng) * p.progress

if(p.progress >= 1){
packets.splice(i,1)
}

}

// update render layer
globe.pointsData(points.concat(packets))

}

setInterval(animatePackets,50)

// ======================================================
// FOCUS CAMERA ON ATTACK
// ======================================================

function focusAttack(lat,lng){

globe.pointOfView({

lat:lat,
lng:lng,
altitude:1.5

},800)

}


// ======================================================
// SWARM BURST
// ======================================================

function createSwarmBurst(lat,lng){

for(let i=0;i<5;i++){

setTimeout(()=>{

rings.push({

lat:lat,
lng:lng,
maxR:6+Math.random()*4

})

// keep ring list bounded
if(rings.length > MAX_RINGS){
rings.shift()
}

globe.ringsData(rings)

},i*120)

}

}


// ======================================================
// THREAT FLASH
// ======================================================

function createThreatFlash(lat,lng){

points.push({

lat:lat,
lng:lng,
size:1.5,
color:"#ff0033"

})

// keep list bounded
if(points.length > MAX_POINTS){
points.shift()
}

globe.pointsData(points)

setTimeout(()=>{

points.shift()
globe.pointsData(points)

},800)

}

// ======================================================
// HEATMAP UPDATE
// ======================================================

function addHeat(lat,lng){

heatmap.push({
lat:lat,
lng:lng,
weight:1
})

// limit heatmap growth
if(heatmap.length > 1500){
heatmap.shift()
}

globe.heatmapsData([heatmap])

}


// ======================================================
// PROCESS ALERT
// ======================================================

function processAlert(alert){

const lat=parseFloat(alert.latitude)
const lng=parseFloat(alert.longitude)

if(!lat || !lng) return

// visualization
createAttackBeam(lat,lng,alert.severity)
createSwarmBurst(lat,lng)
createThreatFlash(lat,lng)
addHeat(lat,lng)
focusAttack(lat,lng)
createPacketStream(lat,lng)

// track severity

if(alert.severity && severityStats[alert.severity] !== undefined){

severityStats[alert.severity]++


}

// track country

if(alert.country_code){

countryStats[alert.country_code] =

(countryStats[alert.country_code] || 0) + 1

}

updateSOCPanel()

}

// ======================================================
// UPDATE SOC PANEL
// ======================================================

function updateSOCPanel(){

document.getElementById("criticalCount").innerText = severityStats.CRITICAL
document.getElementById("highCount").innerText = severityStats.HIGH
document.getElementById("mediumCount").innerText = severityStats.MEDIUM

const list = Object.entries(countryStats)

.sort((a,b)=>b[1]-a[1])

.slice(0,5)

let html=""

list.forEach(([country,count])=>{

html += `<div>${country} : ${count}</div>`

})

document.getElementById("countryList").innerHTML = html

}


// ======================================================
// QUEUE PROCESSOR
// ======================================================

function processQueue(){

if(alertQueue.length===0) return

const alert=alertQueue.shift()

processAlert(alert)

}

setInterval(processQueue,120)


// ======================================================
// WEBSOCKET STREAM
// ======================================================

const protocol=location.protocol==="https:"?"wss":"ws"

const ws=new WebSocket(`${protocol}://${location.host}/ws`)

ws.onmessage=e=>{

try{

const msg=JSON.parse(e.data)

if(msg.type==="batch" && Array.isArray(msg.events)){

msg.events.forEach(alert=>{

if(alertQueue.length>MAX_QUEUE){
EVENT_DROP_COUNT++
}else{
alertQueue.push(alert)
}

})

}else{

if(msg.latitude && msg.longitude){

if(alertQueue.length>MAX_QUEUE){
EVENT_DROP_COUNT++
}else{
alertQueue.push(msg)
}

}

}

}catch(err){

console.error("WebSocket error",err)

}

}


// ======================================================
// LOAD DATABASE ALERTS
// ======================================================

async function load(){

const data=await fetch("/alerts").then(r=>r.json())

if(!Array.isArray(data)){
console.warn("Alerts response not array",data)
return
}

data.forEach(alert=>{

processAlert(alert)

})

}


// ======================================================
// INITIAL LOAD
// ======================================================

load()

// ======================================================
// GLOBE ROTATION
// ======================================================

let rotationSpeed = 0.02

function rotateGlobe(){

const controls = globe.controls()

if(!controls) return

controls.autoRotate = true
controls.autoRotateSpeed = rotationSpeed

}

rotateGlobe()


// ======================================================
// WEBGL CONTEXT RECOVERY
// ======================================================

window.addEventListener("webglcontextlost",function(e){

console.warn("WebGL context lost - reloading dashboard")

e.preventDefault()

setTimeout(()=>{

location.reload()

},2000)

},false)

</script>

</body>
</html>
